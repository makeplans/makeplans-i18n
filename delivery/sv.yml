---
sv:
  booking_ical:
    summary: "%{service} hos %{client}"
  booking_mailer:
    awaiting_confirmation:
      body: |-
        Hej,
         Din förfrågan om att reservera %{title} %{time_range} har registrerats.
         Din reservation är inte bekräftad förrän den är godkänd.
        Du får ett e-postmeddelande när din förfrågan har behandlats.
      subject: Ny reservationsförfrågan
    cancellation:
      header: Hej %{name}
      info: Din bokning %{title} %{time_range} har blitt annullerad.
      subject: Bokningen annullerad
    confirmation:
      booking_count:
        one: Reserverad för %{count} personer.
        other: Reserverad för %{count} personer.
      header: Hej %{name}
      info: Du har bokat %{title} %{time_range}.
      link: Mer information om din bokning
      link_cancellation_info: och möjlighet till avbokning
      resource_info: 'Bokning på: %{resource}.'
      subject: Ny bokning
      subject_service: Bokning av %{service}
    declined:
      header: Hej %{name}
      info: Din bokningsförfrågan för %{title} %{time_range} godkändes inte. Bokningen är inte bekräftad. Försök igen.
      subject: Bokning ej godkänd
    modification:
      header: Hej %{name}
      info: 'Din bokning har ändrats till: %{title} %{time_range}.'
      link: Mer information om din bokning
      link_cancellation_info: och möjlighet till avbokning
      resource_info: 'Bokning på: %{resource}.'
      subject: Bokning ändrad
    request_card:
      header: Hej %{name}
      info: För att enkelt betala för din bokning kan du lägga till dina kortuppgifter.
      link: Lägg till betalkort
      subject: Betala din bokning
    request_payment:
      header: Hej %{name}
      info: Du kan betala för din bokning via länken nedan.
      link: Betala bokningen
      subject: Betalning för din bokning
    verification:
      footer: 'Viktigt: Bokningen är ännu inte genomförd. Om du inte bekräftar din bokning genom att klicka på länken ovan inom %{expires_in} minuter, kan bokningen upphöra att gälla.'
      header: För att slutföra din bokning av %{title} %{time_range} måste du bekräfta den genom att klicka på länken nedan.
      link: Bekräfta bokning
      subject: Vänligen bekräfta din bokning
    waitlist_available:
      confirm_button: Bekräfta bokningen
      header: Hej %{name}
      info: Goda nyheter! En plats har blivit ledig för %{title} %{time_range}.
      resource_info: 'Bokning med: %{resource}.'
      subject: En plats finns tillgänglig för din reservregistrering.
    waitlist_joined:
      header: Hej %{name}
      info: Du har blivit placerad på en väntelista för %{title} %{time_range}. Vi meddelar dig när en plats blir ledig.
      link: Se din registrering på väntelistan
      resource_info: 'Bokning med: %{resource}.'
      subject: Du står på väntelistan.
    waitlist_payment:
      footer: 'OBS: Om du inte slutför betalningen inom %{expires_in} minuter kan din bokning komma att annulleras.'
      header: Hej %{name}
      info: Goda nyheter! En plats har blivit ledig för %{title} %{time_range}. Slutför betalningen för att bekräfta din bokning.
      pay_button: Betala och bekräfta bokningen
      resource_info: 'Bokning med: %{resource}.'
      subject: En plats finns tillgänglig – slutför betalningen för att bekräfta din bokning
  booking_occurrence_mailer:
    cancel:
      body: 'Dina bokningar på %{title} för följande tider har annullerats:'
      subject: Avbokade bokningar
    create:
      body: 'Du har reserverat %{title} för följande tider:'
      subject: Nya reservationer
  booking_sms:
    admin_notification_approvement:
      booking_type_appointment: |-
        ÅTGÄRD BEHÖVS: Bokningsförfrågan senast {{ booking.person.name }}. {{ booking.resource.title }} - {{ booking.title }} på {{ booking.time_range }}

        {{ booking.client.manage_unconfirmed_bookings_link }}

        Planera
      booking_type_attendance: |-
        ÅTGÄRD BEHÖVS: Registreringsbegäran av {{ booking.person.name }} för {{ booking.event.full_title }} {{ booking.time_range }}.

        {{ booking.client.manage_unconfirmed_bookings_link }}

        Planera
    admin_notification_cancellation:
      booking_type_appointment: |-
        AVBOKNING: {{ booking.person.name }} har avbokat sin bokning av {{ booking.resource.title }} - {{ booking.title }} den {{ booking.time_range }}
        Planera
      booking_type_attendance: |-
        AVBOKNING: {{ booking.person.name }} har avbrutit sin registrering för {{ booking.event.full_title }} {{ booking.time_range }}.
        Planera
    admin_notification_confirmation:
      booking_type_appointment: |-
        Ny bokning hos {{ booking.resource.title }} av {{ booking.person.name }}. {{ booking.title }} {{ booking.time_range }}
        Makeplans
      booking_type_attendance: |-
        Ny påmelding for {{ booking.event.full_title }} {{ booking.time_range }} av {{ booking.person.name }}.
        Makeplans
    admin_notification_modification:
      booking_type_appointment: |-
        Ändring av reservation för {{ booking.resource.title }} för {{ booking.person.name }}. {{ booking.title }} {{ booking.time_range }}
        Makeplans
      booking_type_attendance: |-
        Registrering ändrad för {{ booking.event.full_title }} {{ booking.time_range }} av {{ booking.person.name }}.
        Makeplans
    admin_notification_resource_change:
      booking_type_appointment: |-
        Resursändring för {{ booking.resource.title }} med {{ booking.person.name }} {{ booking.title }} {{ booking.time_range }}
        Makeplans
      booking_type_attendance: Ändring av registrering för {{ booking.event.full_title }} {{ booking.time_range }} av {{ booking.person.name }}. Makeplans
    awaiting_confirmation: Du har skickat in en reservationsförfrågan för {{ booking.title }} {{ booking.booked_from }}. Du får ett SMS när den har behandlats.
    cancellation: Din bokning den {{ booking.booked_from }} har avbokats.
    confirmation: Du har bokat {{ booking.title }} {{ booking.booked_from }}.
    declined: Din bokningsförfrågan för {{ booking.title }} {{ booking.booked_from }} godkändes inte. Vänligen försök igen.
    modification: 'Din bokning har ändrats: {{ booking.title }} {{ booking.booked_from }}.'
    reminder: 'Påminnelse: Bokning {% if booking.service != nil %}av {{ booking.title }} {% endif %}{{ booking.booked_from }}.'
    request_card: 'Du kan registrera din betalningsinformation här: %{url}'
    request_payment: 'Du kan betala för din bokning {% if booking.service != nil %} senast {{ booking.title }} {% endif %}{{ booking.booked_from }} här: {{ booking.payment_link }}'
    signature: |2-

      {{ booking.client.name }}
    verification: "{{ booking.verification_code }} är din kod för att bekräfta bokningen av {{ booking.title }}."
    waitlist_available: En plats finns nu tillgänglig för {{ booking.title }} {{ booking.booked_from }}. Gå till länken för att bekräfta din bokning.
    waitlist_joined: Du står på väntelistan för {{ booking.title }} {{ booking.booked_from }}. Vi meddelar dig när en plats blir ledig.
    waitlist_payment: 'En plats finns nu tillgänglig för {{ booking.title }} {{ booking.booked_from }}. Betala här för att bekräfta din bokning: {{ booking.payment_link }}'
  person_mailer:
    export:
      subject: Exportera från Makeplans
    perishable_token:
      body: |-
        Klicka på länken nedan för att logga in.

        %{link}
      subject: Logga in på Makeplans
  person_sms:
    perishable_token: "{{ perishable_token }} är din inloggningskod."
    signature: "\\n{{ client.name }}"
